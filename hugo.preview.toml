baseURL = "https://cathzhou.github.io"
defaultContentLanguage = "en"
languageCode = "en"
title = "Catherine Zhou's Personal Website"
theme = "dream"

enableGitInfo = true
enableRobotsTXT = true

hasCJKLanguage = true

# [services]
# [services.disqus]
# shortname = "cathzhou"
